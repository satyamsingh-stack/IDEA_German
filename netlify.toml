[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# Git Gateway configuration for CMS - apply to all branch deploys
[context.branch]
  command = "npm run build"
  [context.branch.environment]
    GIT_AUTHOR_NAME = "CMS User"
    GIT_AUTHOR_EMAIL = "cms@netlify.com"

# Redirect rules are in public/_redirects file for SPA + admin routing