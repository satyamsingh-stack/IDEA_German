<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDEA Schweiz | Forschungsinstitut für sexuelle Orientierung & Menschenrechte</title>
    <meta name="description" content="IDEA (Inclusion Diversity Equality Action) ist ein gemeinnütziges, unabhängiges rechtsinstitut für sexuelle Orientierung in Europa, der Schweiz und Deutschland." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function(user) {
          if (!user) {
            window.netlifyIdentity.on('login', function() {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
  </body>
</html>
