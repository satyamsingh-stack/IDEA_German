backend:
  name: git-gateway
  branch: release-cms
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Delete "{{path}}"'
    openAuthoring: 'Create {{collection}} "{{slug}}" {{authoringDate}}'

media_folder: 'public/uploads'
public_folder: '/uploads'

publish_mode: editorial_workflow

collections:
  - name: blogs
    label: Blogs
    folder: content/blogs
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Description', name: 'description', widget: 'text', required: true }
      - { label: 'Author', name: 'author', widget: 'string', required: false }
      - { label: 'Publish Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD' }
      - {
          label: 'Category',
          name: 'category',
          widget: 'select',
          options:
            [
              'Gender & Sexuality',
              'Migration & Asylum',
              'Comparative Law',
              'Equality & Non-Discrimination',
              'Legal Commentary',
              'Research Insights',
            ],
          required: false,
        }
      - { label: 'Featured Image', name: 'featured_image', widget: 'image', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown', required: true }

  - name: publications
    label: Publications
    folder: content/publications
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string', required: false }
      - { label: 'Description', name: 'description', widget: 'text', required: false }
      - { label: 'Link Label Text', name: 'label_text', widget: 'string', required: true, hint: 'Custom text shown as the link label in the publications listing. Defaults to Title if left blank.' }
      - { label: 'PDF Link URL', name: 'pdf_link', widget: 'string', required: true, hint: 'Optional explicit PDF URL. If left blank, the PDF File upload field below is used instead.' }
      - { label: 'Author', name: 'author', widget: 'string', required: false }
      - { label: 'Publish Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD', required: false }
      - {
          label: 'Category',
          name: 'category',
          widget: 'select',
          options:
            [
              'Comparative Legal Analysis',
              'Migration, Asylum & Transnational Law',
              'Law & Lived Experience',
              'Violence, Protection & Legal Gaps',
              'Policy & Commentary',
              'German Publications',
            ],
          required: false,
        }
      - { label: 'Featured Image', name: 'featured_image', widget: 'image', required: false }
      - { label: 'PDF File', name: 'pdf_file', widget: 'file', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown', required: true }

  - name: newsletter
    label: Newsletter
    folder: content/newsletter
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Description', name: 'description', widget: 'text', required: true }
      - { label: 'Issue Number', name: 'issue_number', widget: 'number', required: true }
      - { label: 'Publish Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD' }
      - { label: 'Featured Image', name: 'featured_image', widget: 'image', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown', required: true }
